name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Peal
        uses: actions/checkout@v4
        with:
          path: peal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-cache-${{ hashFiles('peal/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-cache-

      - name: Install dependencies
        working-directory: peal
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: peal
        run: bun run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /peal

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: peal/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
